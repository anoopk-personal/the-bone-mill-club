name: PR Security

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Untrusted PR code must never have repository write or deployment access.
permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate branch name and PR description
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              pr = json.load(f)["pull_request"]
          
          branch = pr["head"]["ref"]
          title = (pr.get("title") or "").strip()
          body = pr.get("body") or ""
          errors = []
          
          branch_match = re.fullmatch(
              r"(feature|fix|docs|chore)/[a-z0-9]+(?:-[a-z0-9]+)*", branch
          )
          if not branch_match:
              errors.append("Branch must be feature/, fix/, docs/, or chore/ followed by lowercase kebab-case.")
          
          title_match = re.fullmatch(r"(feature|fix|docs|chore): \S.*", title)
          if not title_match:
              errors.append("PR title must begin with feature:, fix:, docs:, or chore:.")
          elif branch_match and title_match.group(1) != branch_match.group(1):
              errors.append("PR title type must match the branch prefix.")
          
          def section_text(heading):
              match = re.search(r"(?im)^##[ \t]+" + heading + r"[ \t]*$", body)
              if not match:
                  return None
              rest = body[match.end():]
              next_section = re.search(r"(?m)^##[ \t]+\S", rest)
              section = rest[:next_section.start()] if next_section else rest
              return re.sub(r"(?s)<!--.*?-->", "", section).strip()
          
          for heading in ("Summary", "Verification"):
              value = section_text(heading)
              if not value or not any(char.isalnum() for char in value):
                  errors.append("PR body needs a nonempty ## " + heading + " section.")
          
          if errors:
              for error in errors:
                  print("::error::" + error)
              sys.exit(1)
          
          print("Branch, title, and PR sections are valid.")
          PY
      - name: Checkout PR (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate patch formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git diff --check "$BASE_SHA" HEAD

      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 60 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan PR commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact \
            --log-opts="${BASE_SHA}..HEAD" .
