name: PR Security

on:
  pull_request:
    branches: [main]

# Untrusted PR code must never have repository write or deployment access.
permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate patch formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git diff --check "$BASE_SHA" HEAD

      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 60 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan PR commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact \
            --log-opts="${BASE_SHA}..HEAD" .
