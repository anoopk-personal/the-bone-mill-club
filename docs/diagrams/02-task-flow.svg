.0 1438.0,219.0 V208.0Z" fill="none" stroke="white" stroke-width="2.5" /><path d="M1446.0,219.0 L1451.0,224.0 L1460.0,214.0" fill="none" stroke="white" stroke-width="3" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="1493.0" y="198">Tool Gateway</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" x="1493.0" y="223">policy + credentials</text><line stroke="#CBD7E5" stroke-dasharray="7,7" stroke-width="2" x1="1535" x2="1535" y1="281" y2="1030" /><rect fill="#FFFFFF" height="101" rx="11" ry="11" stroke="#D9E3EE" stroke-width="1.8" width="218" x="1703.0" y="169" /><rect fill="#CB7324" height="101" rx="10" ry="10" width="52" x="1703.0" y="169" /><rect fill="#CB7324" height="101" width="12" x="1743.0" y="169" /><circle cx="1718.0" cy="208.0" fill="white" r="3.5" /><circle cx="1738.0" cy="208.0" fill="white" r="3.5" /><circle cx="1718.0" cy="228.0" fill="white" r="3.5" /><circle cx="1738.0" cy="228.0" fill="white" r="3.5" /><circle cx="1728.0" cy="218.0" fill="white" r="3.5" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="1770.0" y="198">External APIs</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" x="1770.0" y="223">search / LLM / email</text><line stroke="#CBD7E5" stroke-dasharray="7,7" stroke-width="2" x1="1812" x2="1812" y1="281" y2="1030" /><rect fill="#FFFFFF" height="101" rx="11" ry="11" stroke="#D9E3EE" stroke-width="1.8" width="196" x="1982.0" y="169" /><rect fill="#2875CD" height="101" rx="10" ry="10" width="52" x="1982.0" y="169" /><rect fill="#2875CD" height="101" width="12" x="2022.0" y="169" /><polygon fill="none" points="2008.0,203.0 2023.0,212.0 2008.0,221.0 1993.0,212.0" stroke="white" stroke-width="2" /><path d="M1993.0,212.0 V228.0 L2008.0,236.0 L2023.0,228.0 V212.0 M2008.0,221.0 V236.0" fill="none" stroke="white" stroke-width="2" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="2049.0" y="198">Cloud Storage</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" x="2049.0" y="223">reports</text><line stroke="#CBD7E5" stroke-dasharray="7,7" stroke-width="2" x1="2080" x2="2080" y1="281" y2="1030" /><path d="M150,331 L427,331" fill="none" marker-end="url(#arrow)" stroke="#2875CD" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="288.5" y="319">1 · Submit request</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="288.5" y="357">Tailnet HTTPS; user session</text><path d="M427,407 L981,407" fill="none" marker-end="url(#arrow)" stroke="#2875CD" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="704.0" y="395">2 · Create task</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="704.0" y="433">Idempotency key; queued</text><path d="M704,488 L427,488" fill="none" marker-end="url(#arrow)" stroke="#2875CD" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="565.5" y="476">3 · Pull schedule tick</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="565.5" y="514">Due-task scan after restart</text><path d="M427,573 L981,573" fill="none" marker-end="url(#arrow)" stroke="#2875CD" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="704.0" y="561">4 · Reserve capacity</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="704.0" y="599">Atomic ≤3 slots + budget</text><path d="M427,654 L1258,654" fill="none" marker-end="url(#arrow)" stroke="#2875CD" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="842.5" y="642">5 · Launch fixed Job</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="842.5" y="680">Run Jobs API; task ID override</text><path d="M1258,737 L1535,737" fill="none" marker-end="url(#arrow-green)" stroke="#087D76" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="1396.5" y="725">6 · Request a tool</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="1396.5" y="763">ID token + task-bound scope</text><path d="M1535,819 L1812,819" fill="none" marker-end="url(#arrow)" stroke="#CB7324" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="1673.5" y="807">7 · Fetch / infer</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="1673.5" y="845">Approved destination; metered</text><path d="M1535,895 L2080,895" fill="none" marker-end="url(#arrow-green)" stroke="#087D76" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="1807.5" y="883">8 · Save validated output</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="1807.5" y="921">Private US regional storage</text><path d="M1535,964 L981,964" fill="none" marker-end="url(#arrow-green)" stroke="#087D76" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.7" /><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="1258.0" y="952">9 · Commit result and cost</text><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="1258.0" y="990">Task status + audit trail</text><rect fill="#FFFBF3" height="105" rx="9" stroke="#EADAB9" stroke-width="1.5" width="622" x="90" y="1066" /><text fill="#CB7324" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="104" y="1092">NO DUPLICATE EFFECTS</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="104" y="1117">Pub/Sub delivers at least once.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="104" y="1141">Reconcile Cloud Run execution IDs.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="104" y="1165">Use idempotent tool calls or require reapproval.</text><rect fill="#FFFBF3" height="105" rx="9" stroke="#EADAB9" stroke-width="1.5" width="674" x="744" y="1066" /><text fill="#CB7324" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="758" y="1092">NO HIDDEN FOURTH WORKER</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="758" y="1117">A queue rate limit is not a global Job limit.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="758" y="1141">Use Firestore transaction slots and job reconciliation.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="758" y="1165">An expired lease does not release a live execution.</text><rect fill="#FFFBF3" height="105" rx="9" stroke="#EADAB9" stroke-width="1.5" width="673" x="1451" y="1066" /><text fill="#CB7324" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" x="1465" y="1092">NO RAW KEYS IN WORKERS</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="1465" y="1117">Only the gateway may read approved API secrets.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="1465" y="1141">No direct Firestore access from the Research Job.</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="1465" y="1165">All worker traffic follows Direct VPC egress.</text><line stroke="#D9E3EE" stroke-width="2" x1="50" x2="2150" y1="1205" y2="1205" /><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" x="50" y="1238">Final status: dashboard reads Firestore; notification contains minimal data.  Approval expires in 24 hours and denies by default.</text></svg>