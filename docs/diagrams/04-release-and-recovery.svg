ze="16" font-weight="700" x="118" y="952">RESTORE ORDER</text><text fill="#11243A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" x="118" y="977">Stop dispatch  →  restore identity  →  restore critical state  →  reconcile Job IDs  →  restore reports  →  verify budgets/approvals  →  resume.</text><line stroke="#D9E3EE" stroke-width="2" x1="50" x2="2050" y1="1135" y2="1135" /><text fill="#50647B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" x="50" y="1168">No unattended merge, cloud provisioning, paid service enablement, or machine purchase is authorized by the documentation PR.</text></svg>